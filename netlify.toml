# Live site = the latest Claude Design build in /web (single file, Firebase login, live dates).
# The React app in /src stays in the repo but is not deployed.
[build]
  command = ""
  publish = "web"
  functions = "netlify/functions"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
